# ============================================================================
# Reusable Container Security Workflow
# ============================================================================
# Combines Trivy container image scanning with Hadolint Dockerfile linting
#
# Usage from downstream repos:
#   jobs:
#     container-security:
#       uses: ByronWilliamsCPA/.github/.github/workflows/python-container-security.yml@d5cf99101d4150ae5832d154cb42993705a09e31 # v7.0.1
#       with:
#         image-ref: 'myapp:latest'
#         dockerfile-path: './Dockerfile'
#
# Features:
#   - Trivy container image vulnerability scanning
#   - Hadolint Dockerfile best practices linting
#   - SARIF and SBOM results published as workflow artifacts (Security tab
#     upload removed; it required paid GitHub Advanced Security)
#   - Configurable severity thresholds
#   - Optional container SBOM generation
# ============================================================================

name: Container Security (Reusable)

on:
  workflow_call:
    inputs:
      # Image scanning configuration
      image-ref:
        description: 'Container image reference to scan (e.g., myapp:latest or ghcr.io/org/app:v1)'
        type: string
        required: false
        default: ''

      build-image:
        description: 'Build image from Dockerfile before scanning'
        type: boolean
        required: false
        default: true

      dockerfile-path:
        description: 'Path to Dockerfile'
        type: string
        required: false
        default: './Dockerfile'

      build-context:
        description: 'Docker build context path'
        type: string
        required: false
        default: '.'

      image-tag:
        description: 'Tag for built image (used when build-image is true)'
        type: string
        required: false
        default: 'security-scan:latest'

      # Scanning configuration
      severity-threshold:
        description: 'Minimum severity to report (CRITICAL, HIGH, MEDIUM, LOW)'
        type: string
        required: false
        default: 'CRITICAL,HIGH'

      fail-on-vulnerabilities:
        description: 'Fail workflow if vulnerabilities found at threshold'
        type: boolean
        required: false
        default: true

      # #ASSUME callers pass true on pull_request/merge_group (fast gate, only
      # actionable findings block a merge) and false on the weekly schedule or a
      # manual run (full inventory, including base-image CVEs with no upstream
      # fix). Default is false so the reusable workflow keeps reporting the full
      # set unless a caller opts into the reduced view.
      # #EDGE this suppresses findings from both the failing gate and the SARIF
      # upload, so a scan run with ignore-unfixed: true will retire previously
      # uploaded unfixed alerts in the Security tab for the same category. The
      # weekly full scan re-opens them.
      ignore-unfixed:
        description: 'Ignore vulnerabilities that have no available fix'
        type: boolean
        required: false
        default: false

      # Suppression revisit dates. A Trivy suppression with no `expired_at` is
      # permanent: the finding leaves every scan and nothing forces a second
      # look. This gate requires a revisit date on each entry, no further out
      # than ignore-expiry-horizon-days.
      enforce-ignore-expiry:
        description: 'Require a revisit date (expired_at) on every .trivyignore.yaml entry'
        type: boolean
        required: false
        default: true

      ignore-expiry-horizon-days:
        description: 'Furthest a suppression revisit date may be set from today'
        type: number
        required: false
        default: 90

      allow-legacy-trivyignore:
        description: 'Tolerate a plain-text .trivyignore, which cannot carry revisit dates'
        type: boolean
        required: false
        default: false

      # SUPPLY-CHAIN NOTE: the default is 'main', a FLOATING ref, so revisit
      # rules roll out fleet-wide without a per-repo edit. Callers wanting
      # supply-chain rigor pin an immutable point tag or full SHA; the org tag
      # ruleset makes v* tags immutable. Mirrors python-fips-compatibility.yml.
      central-checker-ref:
        description: 'Ref of ByronWilliamsCPA/.github supplying the revisit-date checker'
        type: string
        required: false
        default: 'main'

      # Hadolint configuration
      run-hadolint:
        description: 'Run Hadolint Dockerfile linting'
        type: boolean
        required: false
        default: true

      hadolint-failure-threshold:
        description: 'Hadolint failure threshold (error, warning, info, style, ignore, none)'
        type: string
        required: false
        default: 'error'

      # SBOM configuration
      generate-sbom:
        description: 'Generate container SBOM'
        type: boolean
        required: false
        default: false

      # Artifact configuration
      upload-sarif:
        description: 'Deprecated: SARIF upload to the GitHub Security tab has been removed (it required paid GitHub Advanced Security). This input is accepted for backward compatibility but no longer has any effect; SARIF results are always published as a workflow artifact.'
        type: boolean
        required: false
        default: true

      artifact-retention-days:
        description: 'Days to retain security artifacts'
        type: number
        required: false
        default: 30

      # DHI Registry
      enable-dhi-login:
        description: 'Enable login to Docker Hardened Images (dhi.io) registry'
        type: boolean
        required: false
        default: true

    secrets:
      DHI_USERNAME:
        description: 'Docker Hardened Images registry username'
        required: false
      DHI_PAT:
        description: 'Docker Hardened Images registry personal access token'
        required: false

permissions: {}

jobs:
  # Hadolint Dockerfile linting
  hadolint:
    name: Dockerfile Lint (Hadolint)
    if: ${{ inputs.run-hadolint }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Check Dockerfile exists
        id: check-dockerfile
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}
        run: |
          if [ -f "$DOCKERFILE_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Dockerfile not found at $DOCKERFILE_PATH"
          fi

      - name: Run Hadolint
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: ${{ inputs.dockerfile-path }}
          failure-threshold: ${{ inputs.hadolint-failure-threshold }}
          format: sarif
          output-file: hadolint-results.sarif

      - name: Upload Hadolint SARIF artifact
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hadolint-results
          path: hadolint-results.sarif
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore

      - name: Hadolint Summary
        if: always() && steps.check-dockerfile.outputs.exists == 'true'
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}
          HADOLINT_FAILURE_THRESHOLD: ${{ inputs.hadolint-failure-threshold }}
        run: |
          echo "## Hadolint Dockerfile Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Dockerfile:** \`$DOCKERFILE_PATH\`" >> $GITHUB_STEP_SUMMARY
          echo "**Failure Threshold:** $HADOLINT_FAILURE_THRESHOLD" >> $GITHUB_STEP_SUMMARY

  # Revisit-date enforcement for Trivy suppressions
  #
  # Separate job rather than a step inside trivy-scan: it needs the caller's
  # working tree but not the image, so it runs in parallel with the build and
  # stays green (or red) independently of whether an image was produced.
  # #ASSUME contents: read is sufficient; the job checks out two repos and runs
  # a local checker, with no secrets, artifacts, or SARIF upload.
  ignore-expiry:
    name: Suppression Revisit Dates
    if: ${{ inputs.enforce-ignore-expiry }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          # No git operation in this job needs the token; leaving it in
          # .git/config would expose it for the rest of the job.
          persist-credentials: false

      # #ASSUME ByronWilliamsCPA/.github is public; a public cross-repo
      # checkout needs no token beyond the caller's default GITHUB_TOKEN, and
      # no secret is passed here.
      - name: Fetch org-central revisit checker
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          repository: ByronWilliamsCPA/.github
          ref: ${{ inputs.central-checker-ref }}
          path: .trivy-revisit-checker
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install checker dependencies
        # Pinned exactly (SonarCloud S8544: an unpinned install resolves to
        # whatever PyPI serves at run time).
        run: python -m pip install --quiet --disable-pip-version-check 'pyyaml==6.0.2'

      # #CRITICAL the same detection the scan job uses. Validating a hardcoded
      # `.trivyignore.yaml` while the scan honours `.trivyignore.yml` too would
      # leave the `.yml` variant applied but never checked for `expired_at`,
      # which is exactly the unbounded suppression this job exists to prevent.
      - name: Detect Trivy ignore file
        id: ignorefile
        run: |
          if [ -f .trivyignore.yaml ]; then
            echo "path=.trivyignore.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f .trivyignore.yml ]; then
            echo "path=.trivyignore.yml" >> "$GITHUB_OUTPUT"
          else
            # Non-existent path: the checker reports "nothing to validate".
            echo "path=.trivyignore.yaml" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate suppression revisit dates
        env:
          TRIVYIGNORE_PATH: ${{ steps.ignorefile.outputs.path }}
          LEGACY_TRIVYIGNORE_PATH: .trivyignore
          MAX_HORIZON_DAYS: ${{ inputs.ignore-expiry-horizon-days }}
          ALLOW_LEGACY_TRIVYIGNORE: ${{ inputs.allow-legacy-trivyignore }}
        run: python .trivy-revisit-checker/scripts/check_trivy_ignore_expiry.py

      - name: Revisit-date summary
        if: always()
        env:
          MAX_HORIZON_DAYS: ${{ inputs.ignore-expiry-horizon-days }}
          IGNORE_FILE: ${{ steps.ignorefile.outputs.path }}
        run: |
          # Single grouped redirect rather than one per line (SC2129).
          {
            echo "## Trivy Suppression Revisit Dates"
            echo ""
            if [ -n "${IGNORE_FILE}" ] && [ -f "${IGNORE_FILE}" ]; then
              echo "Validated \`${IGNORE_FILE}\`: every entry must carry an"
              echo "\`expired_at\` revisit date no more than ${MAX_HORIZON_DAYS} days out."
            else
              echo "No \`.trivyignore.yaml\` or \`.trivyignore.yml\` present; no suppressions to validate."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Trivy container image scanning
  trivy-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      # Unconditional: the working tree supplies the suppression file even when
      # no image is built here (registry-image scans via image-ref).
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          # The scan reads the working tree; it runs no git operation that
          # needs the token.
          persist-credentials: false

      # #CRITICAL Trivy's default ignorefile is `.trivyignore` only; it does NOT
      # auto-detect the YAML variant (pkg/result.DefaultIgnoreFile). The YAML
      # form is the only one that can carry `expired_at`, so it has to be passed
      # explicitly or every dated suppression would be silently inert.
      - name: Detect Trivy ignore file
        id: ignorefile
        run: |
          if [ -f .trivyignore.yaml ]; then
            echo "path=.trivyignore.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f .trivyignore.yml ]; then
            echo "path=.trivyignore.yml" >> "$GITHUB_OUTPUT"
          else
            # Empty leaves the action's ignorefile handling switched off, which
            # falls back to Trivy's own .trivyignore default.
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      # Conditional DHI login: docker/login-action emits "##[error]Username and
      # password required" when secrets are absent, which clutters CI logs even
      # though continue-on-error suppresses the failure. This shell-based form
      # silently skips when credentials are unset, and uses --password-stdin so
      # the PAT never appears in process listings.
      - name: Login to DHI Registry
        if: inputs.enable-dhi-login
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_PAT: ${{ secrets.DHI_PAT }}
        run: |
          if [ -z "${DHI_USERNAME}" ] || [ -z "${DHI_PAT}" ]; then
            echo "::notice::DHI credentials not configured; skipping dhi.io login (unauthenticated public pulls only)"
            exit 0
          fi
          echo "${DHI_PAT}" | docker login dhi.io -u "${DHI_USERNAME}" --password-stdin
        continue-on-error: true

      - name: Check Dockerfile exists
        if: ${{ inputs.build-image }}
        id: check-dockerfile
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}
        run: |
          if [ -f "$DOCKERFILE_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Dockerfile not found at $DOCKERFILE_PATH, skipping build"
          fi

      - name: Build container image
        if: ${{ inputs.build-image && steps.check-dockerfile.outputs.exists == 'true' }}
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          BUILD_CONTEXT: ${{ inputs.build-context }}
        run: |
          echo "Building container image..."
          docker build \
            -f "$DOCKERFILE_PATH" \
            -t "$IMAGE_TAG" \
            "$BUILD_CONTEXT"

      - name: Determine image to scan
        id: image
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          IMAGE_REF: ${{ inputs.image-ref }}
          BUILD_IMAGE: ${{ inputs.build-image }}
          EXISTS: ${{ steps.check-dockerfile.outputs.exists }}
        run: |
          if [ "$BUILD_IMAGE" == "true" ] && [ "$EXISTS" == "true" ]; then
            echo "ref=$IMAGE_TAG" >> $GITHUB_OUTPUT
          elif [ -n "$IMAGE_REF" ]; then
            echo "ref=$IMAGE_REF" >> $GITHUB_OUTPUT
          else
            echo "ref=" >> $GITHUB_OUTPUT
            echo "::warning::No image to scan"
          fi

      - name: Trivy vulnerability scan
        if: steps.image.outputs.ref != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: 'table'
          severity: ${{ inputs.severity-threshold }}
          scanners: 'vuln'  # Only scan for vulnerabilities, not licenses
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          trivyignores: ${{ steps.ignorefile.outputs.path }}
          exit-code: ${{ inputs.fail-on-vulnerabilities && '1' || '0' }}

      # Generated unconditionally (no longer gated on the deprecated
      # upload-sarif input) so the SARIF report always lands in the
      # "Upload container security artifacts" step below.
      - name: Trivy SARIF report
        if: ${{ steps.image.outputs.ref != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          scanners: 'vuln'  # Only scan for vulnerabilities, not licenses
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          trivyignores: ${{ steps.ignorefile.outputs.path }}

      - name: Generate container SBOM
        if: ${{ inputs.generate-sbom && steps.image.outputs.ref != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: 'cyclonedx'
          output: 'container-sbom.json'

      - name: Upload container security artifacts
        if: always() && steps.image.outputs.ref != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: container-security-reports
          path: |
            trivy-container-results.sarif
            container-sbom.json
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore

      - name: Container Security Summary
        if: always()
        env:
          SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
          GENERATE_SBOM: ${{ inputs.generate-sbom }}
          IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
          IMAGE_SCANNED: ${{ steps.image.outputs.ref }}
        run: |
          # Single grouped redirect rather than one per line (SC2129), and the
          # image ref reaches the script through env rather than by direct
          # interpolation into the run body.
          {
            echo "## Container Security Scan Results"
            echo ""

            if [ -n "${IMAGE_SCANNED}" ]; then
              echo "**Image:** \`${IMAGE_SCANNED}\`"
              echo "**Severity Threshold:** ${SEVERITY_THRESHOLD}"

              if [ "${IGNORE_UNFIXED}" == "true" ]; then
                echo "**Scope:** fixable vulnerabilities only (unfixed ignored)"
              else
                echo "**Scope:** all vulnerabilities, including those with no available fix"
              fi

              echo ""

              if [ "${GENERATE_SBOM}" == "true" ]; then
                echo "Container SBOM generated (CycloneDX format)"
              fi
            else
              echo "No container image was scanned."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Summary job
  security-summary:
    name: Security Summary
    needs: [hadolint, trivy-scan, ignore-expiry]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      # #CRITICAL job results reach the script through env, never by direct
      # interpolation into the run body (CodeQL actions/code-injection). The
      # values are a fixed enum today, but the env indirection is the rule the
      # rest of this library follows and it costs nothing here.
      - name: Overall security summary
        env:
          HADOLINT_RESULT: ${{ needs.hadolint.result }}
          TRIVY_RESULT: ${{ needs.trivy-scan.result }}
          IGNORE_EXPIRY_RESULT: ${{ needs.ignore-expiry.result }}
        run: |
          # Single grouped redirect rather than one per line (SC2129).
          {
            echo "## Container Security Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Hadolint | ${HADOLINT_RESULT} |"
            echo "| Trivy Scan | ${TRIVY_RESULT} |"
            echo "| Suppression Revisit Dates | ${IGNORE_EXPIRY_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for failures
        if: ${{ needs.hadolint.result == 'failure' || needs.trivy-scan.result == 'failure' || needs.ignore-expiry.result == 'failure' }}
        run: |
          echo "::error::Container security checks failed"
          exit 1
