# Python Security Analysis - Reusable Workflow
# Comprehensive security scanning with Bandit and OSV-Scanner
#
# The CodeQL and Dependency Review jobs were removed: both depend on GitHub
# Advanced Security (Code Security), which GitHub now bills separately, so
# neither functions on these repositories. Remaining coverage is Bandit
# (Python SAST) and OSV-Scanner (dependency CVEs) here, plus Snyk, Trivy,
# SonarCloud, OpenSSF Scorecard, and GitGuardian in their own workflows.
# The run-codeql and run-dependency-review inputs are retained as inert
# no-ops; see their declarations below.
#
# Usage from downstream repos:
#   jobs:
#     security:
#       uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@d5cf99101d4150ae5832d154cb42993705a09e31 # v7.0.1
#       permissions:
#         contents: read
#         pull-requests: read     # detect-changes path filter
#       with:
#         source-directory: 'src'
#         fail-on-high: true
#
# Caller permission contract:
# #CRITICAL: reusable caller/callee permission inheritance
# #ASSUME: callers grant at least the two scopes shown above, at workflow or
#   calling-job level (calling-job level is tighter and preferred when the
#   caller's workflow has other jobs that need narrower grants). GitHub
#   validates called-job permission requests against the caller's grant at
#   workflow parse/startup time; a called job requesting more than the
#   caller grants fails the whole run at startup ("startup_failure" with
#   the generic "workflow file issue" message), before any job executes.
# #VERIFY: after changing permissions here or in a caller, confirm with:
#   gh run list -R ByronWilliamsCPA/<repo> --workflow=security-analysis.yml
#   then gh run view <run-id> --json conclusion on the newest run:
#   "startup_failure" means the caller's grant is insufficient; any run
#   that started confirms the grant passed validation. (gh run list alone
#   shows only generic pass/fail. security-analysis.yml is the caller's
#   own workflow filename in current caller repos; substitute if a caller
#   names its file differently.)
# #EDGE: no job here requests security-events: write, actions: read, or
#   pull-requests: write any more; those three were needed only by the
#   removed CodeQL and Dependency Review jobs. Callers that still grant them
#   keep working, because over-granting is not a startup failure, but they
#   should trim the grant to the two scopes above. Do not narrow below
#   contents: read plus pull-requests: read.
# #VERIFY: after narrowing a caller's grant, trigger one caller run and
#   confirm gh run view <run-id> --json conclusion does not report
#   "startup_failure".

name: Python Security Analysis (Reusable)

on:
  workflow_call:
    inputs:
      source-directory:
        description: 'Source code directory to scan'
        type: string
        required: false
        default: 'src'

      python-version:
        description: 'Python version for scanning'
        type: string
        required: false
        default: '3.12'

      fail-on-high:
        description: 'Fail build on HIGH/CRITICAL vulnerabilities'
        type: boolean
        required: false
        default: true

      fail-on-medium:
        description: 'Fail build on MEDIUM vulnerabilities'
        type: boolean
        required: false
        default: false

      # DEPRECATED no-op. The codeql job was removed because CodeQL code
      # scanning requires GitHub Advanced Security (Code Security), which is
      # now billed. This input has no effect; no job reads it. It is retained
      # only so the sixteen caller repos that still pass run-codeql do not
      # startup-fail, because GitHub hard-fails a workflow_call when a caller
      # passes an undeclared input. A follow-up change removes the input once
      # every caller has dropped it from its with: block.
      run-codeql:
        description: 'DEPRECATED no-op. CodeQL was removed (GitHub Advanced Security is billed); input kept only so existing callers do not startup-fail. Remove from your with: block.'
        type: boolean
        required: false
        default: false

      # DEPRECATED no-op. The dependency-review job was removed because
      # actions/dependency-review-action requires GitHub Advanced Security
      # (Code Security), which is now billed. This input has no effect; no job
      # reads it. It is retained only so the sixteen caller repos that still
      # pass run-dependency-review do not startup-fail, because GitHub
      # hard-fails a workflow_call when a caller passes an undeclared input. A
      # follow-up change removes the input once every caller has dropped it
      # from its with: block.
      run-dependency-review:
        description: 'DEPRECATED no-op. Dependency Review was removed (GitHub Advanced Security is billed); input kept only so existing callers do not startup-fail. Remove from your with: block.'
        type: boolean
        required: false
        default: false

      run-bandit:
        description: 'Run Bandit static analysis'
        type: boolean
        required: false
        default: true

      run-osv:
        description: 'Run OSV Scanner'
        type: boolean
        required: false
        default: true
      no-build:
        description: 'Pass --no-build to uv sync/run commands (disable for projects with a build backend like hatchling)'
        required: false
        type: boolean
        default: true

      # The Safety scanner was removed in PR #140 (2026-05-18). Deleting the
      # input was a breaking interface change: callers still passing
      # run-safety failed at startup with the opaque "workflow file issue"
      # error, and callers pinned to pre-#140 SHAs would have broken the
      # moment Renovate bumped their pin. Restored as an ignored no-op so
      # existing callers keep working; no job reads it. Remove it from
      # caller with: blocks, then delete this input in a future major
      # revision.
      run-safety:
        description: 'DEPRECATED no-op. Safety scanner was removed (PR #140); input kept only so existing callers do not startup-fail. Remove from your with: block.'
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  # Detect security-relevant changes
  detect-changes:
    name: Detect Security Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      security_files: ${{ steps.filter.outputs.security }}
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Check for security-relevant changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        with:
          filters: |
            security:
              - '**/*.py'
              - '.github/workflows/**'
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'uv.lock'
              - 'requirements*.txt'

  # Python security scanning (Bandit)
  python-security:
    name: Python SAST (Bandit)
    if: ${{ inputs.run-bandit }}
    runs-on: ubuntu-latest
    needs: detect-changes
    timeout-minutes: 15
    env:
      NO_BUILD_FLAG: ${{ inputs.no-build && '--no-build' || '' }}
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # Detect the repo state before attempting uv sync. This reusable workflow is
      # uv-only by org policy (poetry repos are being converted to uv in separate work),
      # but it is still called by some repos that don't have a pyproject.toml (template /
      # docs-only forks like DeQA-Doc) and by uv-managed repos that haven't yet committed
      # a uv.lock. Hardcoding `uv sync --frozen` failed for both categories.
      # Auto-detection skips cleanly when pyproject is absent and drops --frozen when no
      # lockfile exists yet. Poetry repos are explicitly rejected with an actionable error.
      - name: Detect repo state
        id: detect
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "state=skip" >> $GITHUB_OUTPUT
            echo "::notice::No pyproject.toml found at repo root; Bandit SAST will be skipped. Remove the python-security-analysis.yml caller from this repo if it does not need Python security scanning."
          elif [ -f poetry.lock ] || grep -qE '^\[tool\.poetry(\.|])' pyproject.toml; then
            echo "state=poetry-not-supported" >> $GITHUB_OUTPUT
            echo "::error::This repo uses Poetry. The python-security-analysis.yml reusable workflow is uv-only by org policy. Convert this repo to uv before re-enabling Python security analysis."
            exit 1
          elif [ -f uv.lock ]; then
            echo "state=uv-locked" >> $GITHUB_OUTPUT
            echo "Detected: uv with lockfile"
          else
            echo "state=uv-no-lock" >> $GITHUB_OUTPUT
            echo "Detected: uv without lockfile (PEP 621 pyproject.toml only); will sync without --frozen"
          fi
        shell: bash

      - name: Install dependencies (uv with lockfile)
        if: steps.detect.outputs.state == 'uv-locked'
        run: uv sync --all-extras --frozen $NO_BUILD_FLAG
        shell: bash

      # SonarCloud cannot follow the $NO_BUILD_FLAG env-var indirection, and by design no
      # uv.lock exists yet on this path until this step generates one. Inline NOSONAR with
      # rationale; the uv-locked install step above keeps the literal --frozen visible.
      - name: Install dependencies (uv without lockfile)
        if: steps.detect.outputs.state == 'uv-no-lock'
        run: uv sync --all-extras $NO_BUILD_FLAG  # NOSONAR(S8541,S8544): --no-build opt-out via `no-build` input; no uv.lock by design on this path
        shell: bash

      - name: Skip notice (no pyproject.toml)
        if: steps.detect.outputs.state == 'skip'
        run: |
          echo "## Bandit SAST Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No pyproject.toml at repo root, nothing to scan." >> $GITHUB_STEP_SUMMARY

      # --frozen is safe in both detected states: the install step above always produces
      # uv.lock before this step runs. Hardcoding the literal eliminates SonarCloud S8544
      # on the uv run line below. S8541 is suppressed via the preceding-line NOSONAR.
      - name: Bandit Static Analysis
        if: ${{ inputs.run-bandit && (steps.detect.outputs.state == 'uv-locked' || steps.detect.outputs.state == 'uv-no-lock') }}
        env:
          SRC_DIR: ${{ inputs.source-directory }}
        shell: bash
        run: |
          echo "🔒 Running Bandit security analysis..."
          # Single invocation: writes the JSON report and propagates the exit
          # code so real findings fail the job. Suppress false positives via a
          # .bandit config or inline `# nosec` with justification in source.
          # shellcheck disable=SC2086
          # NOSONAR(S8541): --no-build is opt-out via `no-build` workflow input
          uv run --frozen $NO_BUILD_FLAG bandit -r "$SRC_DIR" \
            -f json -o bandit-report.json \
            -c pyproject.toml

      - name: Upload Security Reports
        if: always() && (steps.detect.outputs.state == 'uv-locked' || steps.detect.outputs.state == 'uv-no-lock')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-security-reports
          path: bandit-report.json

  # OSV Scanner
  osv-scanner:
    name: OSV Vulnerability Scanner
    if: ${{ inputs.run-osv }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2  # v2.3.8
        with:
          scan-args: |-
            --lockfile=uv.lock
            --format=json
            --output=osv-results.json

      - name: Analyze OSV Results
        env:
          FAIL_ON_HIGH: ${{ inputs.fail-on-high }}
          FAIL_ON_MEDIUM: ${{ inputs.fail-on-medium }}
        run: |
          echo "🔍 Analyzing OSV scan results..."
          python3 << 'EOF'
          import json
          import os
          import sys

          def extract_severity(vuln):
              """Extract severity from various possible locations in vulnerability data."""
              # Check direct severity field
              severity = vuln.get('severity')
              if severity:
                  return 'MEDIUM' if str(severity).upper() == 'MODERATE' else str(severity).upper()

              # Check database_specific
              db_specific = vuln.get('database_specific', {})
              if isinstance(db_specific, dict):
                  severity = db_specific.get('severity')
                  if severity:
                      return 'MEDIUM' if str(severity).upper() == 'MODERATE' else str(severity).upper()

              # Check severities array
              severities = vuln.get('severities', [])
              if isinstance(severities, list) and severities:
                  severity_levels = {'CRITICAL': 4, 'HIGH': 3, 'MEDIUM': 2, 'MODERATE': 2, 'LOW': 1}
                  max_severity = 'UNKNOWN'
                  max_level = 0
                  for sev_entry in severities:
                      sev = sev_entry.get('severity', '').upper() if isinstance(sev_entry, dict) else str(sev_entry).upper()
                      level = severity_levels.get(sev, 0)
                      if level > max_level:
                          max_level = level
                          max_severity = sev
                  return 'MEDIUM' if max_severity == 'MODERATE' else max_severity

              return 'UNKNOWN'

          fail_on_high = os.environ["FAIL_ON_HIGH"] == "true"
          fail_on_medium = os.environ["FAIL_ON_MEDIUM"] == "true"

          try:
              with open('osv-results.json', 'r') as f:
                  results = json.load(f)

              vulnerabilities = results.get('results', [])
              print(f'📋 Found {len(vulnerabilities)} vulnerability groups')

              if not vulnerabilities:
                  print('✅ No vulnerabilities found')
                  sys.exit(0)

              high_crit = []
              medium = []
              low = []

              for vuln_group in vulnerabilities:
                  if not isinstance(vuln_group, dict):
                      continue
                  for pkg in vuln_group.get('packages', []):
                      if not isinstance(pkg, dict):
                          continue
                      for vuln in pkg.get('vulnerabilities', []):
                          if not isinstance(vuln, dict):
                              continue
                          severity = extract_severity(vuln)
                          vuln_id = vuln.get('id', 'UNKNOWN')
                          if severity in ['HIGH', 'CRITICAL']:
                              high_crit.append(f"{vuln_id} ({severity})")
                          elif severity == 'MEDIUM':
                              medium.append(f"{vuln_id} ({severity})")
                          else:
                              low.append(f"{vuln_id} ({severity})")

              total = len(high_crit) + len(medium) + len(low)
              print(f'\n📊 OSV Results: {total} total vulnerabilities')

              if high_crit:
                  print(f'❌ HIGH/CRITICAL: {len(high_crit)} vulnerabilities')
                  for v in high_crit[:5]:
                      print(f'   - {v}')
                  if fail_on_high:
                      print('\n❌ Build FAILED: HIGH/CRITICAL vulnerabilities found')
                      sys.exit(1)

              if medium:
                  print(f'⚠️  MEDIUM: {len(medium)} vulnerabilities')
                  if fail_on_medium:
                      print('\n❌ Build FAILED: MEDIUM vulnerabilities found')
                      sys.exit(1)

              if low:
                  print(f'ℹ️  LOW: {len(low)} vulnerabilities')

              if not high_crit:
                  print('\n✅ No HIGH/CRITICAL vulnerabilities found')

          except Exception as e:
              print(f'❌ ERROR: {e}')
              import traceback
              traceback.print_exc()
              sys.exit(1)
          EOF

      - name: Upload OSV Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: osv-scanner-results
          path: osv-results.json

  # Security gate
  security-gate:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, python-security, osv-scanner]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Validate Security Results
        env:
          RESULT_PYTHON_SECURITY: ${{ needs.python-security.result }}
          RESULT_OSV_SCANNER: ${{ needs.osv-scanner.result }}
        run: |
          echo "🔒 Security Analysis Results:"
          echo "Python Security: $RESULT_PYTHON_SECURITY"
          echo "OSV Scanner: $RESULT_OSV_SCANNER"

          is_acceptable() {
            [[ "$1" == "success" || "$1" == "skipped" ]]
          }

          if is_acceptable "$RESULT_PYTHON_SECURITY" && \
             is_acceptable "$RESULT_OSV_SCANNER"; then
            echo "✅ Security gate passed"
            echo "🔐 All security checks completed successfully"
          else
            echo "❌ Security gate failed - review security scan results"
            exit 1
          fi
