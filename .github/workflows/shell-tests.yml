# ============================================================================
# Shell Script Tests
# ============================================================================
# Runs bats tests for scripts/ whenever shell scripts or tests change.
#
# Requirements:
#   - bats-core, bats-support, bats-assert submodules in tests/libs/
#   - jq installed (used by stub helpers in tests)
#
# Run locally:
#   git submodule update --init --recursive
#   ./tests/libs/bats-core/bin/bats tests/*.bats
# ============================================================================

name: Shell Tests

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/shell-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/shell-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  bats:
    name: Bats Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          submodules: recursive

      - name: Run bats tests
        # Discover all .bats files under tests/ rather than naming a single
        # file. Naming tests/update-pinned-actions.bats hid a class of bugs:
        # tests added under tests/fleet-audit-sha-pins.bats (and any future
        # *.bats sibling) were never executed by CI, so STRICT_AUDIT and
        # REPO_LIMIT regressions could ship green. find + -print0/-exec keeps
        # this glob-injection-safe and POSIX-clean.
        run: |
          find tests -maxdepth 1 -name '*.bats' -print0 \
            | xargs -0 ./tests/libs/bats-core/bin/bats

  python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # #ASSUME: contents: read is sufficient; the job only checks out and runs
    # local tests, no secrets, artifacts, or id-token needed.
    # #VERIFY: revisit if a step is added that publishes results or comments.
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Run pytest
        # pytest and pyyaml are pinned to exact versions (SonarCloud S8544:
        # unpinned installs resolve to whatever PyPI serves at run time).
        # pyyaml backs check_trivy_ignore_expiry.py, which parses
        # .trivyignore.yaml suppression files.
        run: uvx --with 'pytest==9.0.3' --with 'pyyaml==6.0.2' pytest tests/python/ -v
