# Python Project - OpenSSF Scorecard
# Evaluates repository security health using OpenSSF Scorecard
#
# This workflow:
#   - Runs OpenSSF Scorecard analysis
#   - Publishes SARIF results as a workflow artifact (Security tab upload
#     removed; it required paid GitHub Advanced Security)
# Note: publish-results is always treated as false by the reusable workflow.
# See python-scorecard.yml Known Limitations for details.
#
# Triggered by:
#   - Push to main branch
#   - Weekly schedule (Sunday at 00:00 UTC)

name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  contents: read
  actions: read

jobs:
  scorecard:
    name: Scorecard Analysis
    uses: ByronWilliamsCPA/.github/.github/workflows/python-scorecard.yml@cb0742cf00832b4e640a47dfca222047c2b70c1c # v10.1.7
    permissions:
      contents: read
      actions: read
